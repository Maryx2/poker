  {!isHost&&!s.playerConnected?<div className="lobby"><div className="lobbyCard"><div className="lobbyIcon">♠</div><h2>{roomCode?'Request a seat':'Join a poker room'}</h2><p>{roomCode?`Room ${roomCode} is host-controlled. Enter your display name and knock. The HOST must accept you before your cards and controls unlock.`:'Enter the 6-character room code your HOST shared with you.'}</p>{!roomCode?<><input className="lobbyInput" value={joinRoom} onChange={e=>setJoinRoom(e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6))} placeholder="ROOM CODE"/><button className="cmd primary" style={{width:'100%'}} disabled={joinRoom.length<4} onClick={()=>{const r=joinRoom.trim().toUpperCase();setRoomCode(r);const u=new URL(location.href);u.searchParams.set('view','player');u.searchParams.set('room',r);history.replaceState({},'',u)}}>ENTER ROOM</button></>:<><input className="lobbyInput" value={joinName} onChange={e=>setJoinName(e.target.value)} placeholder="Your player name"/><button className="cmd primary" style={{width:'100%'}} disabled={s.joinStatus==='pending'} onClick={()=>playerAction('knock',joinName)}>{s.joinStatus==='pending'?'WAITING FOR HOST…':'KNOCK TO JOIN'}</button></>}{s.joinStatus==='pending'&&<div className="lobbyState">Your request is waiting for HOST approval. Keep this page open.</div>}{s.joinStatus==='declined'&&<div className="lobbyState">HOST declined the last request. You can knock again.</div>}{s.joinStatus==='removed'&&<div className="lobbyState">You were removed from the table. Knock again if you want to request the seat.</div>}</div></div>:<main className={'shell '+(!isHost?'playerOnly':'')}>{<Table/>}{isHost?<aside className="sidePanel"><div className="knockCard"><div className="knockHead"><strong>Player is knocking</strong><span className="knockBadge">{s.pendingPlayer?'1 PENDING':s.playerConnected?'ADMITTED':'LOBBY OPEN'}</span></div><div className="lobbyState" style={{marginBottom:10}}>ROOM <b>{roomCode||'…'}</b> · Share the Player Screen URL with the second device.</div>{s.pendingPlayer?<><div className="knockPerson"><div className="knockAvatar">P2</div><div className="knockMeta"><b>{s.pendingPlayer.name}</b><span>Wants to join · {s.pendingPlayer.at}</span></div></div><div className="knockActions"><button className="cmd accent" onClick={acceptKnock}>ACCEPT</button><button className="cmd danger" onClick={declineKnock}>DECLINE</button></div></>:s.playerConnected?<><div className="knockPerson"><div className="knockAvatar">✓</div><div className="knockMeta"><b>{s.playerName}</b><span>Accepted into the table</span></div></div><div className="knockActions"><button className="cmd danger" onClick={removePlayer}>REMOVE PLAYER</button></div></>:<div className="emptyLog">No one is knocking right now. Open the Player Screen and have them request access.</div>}</div><div className="panelCard"><div className="panelTitle"><strong>Host controls</strong><span>DEALER ONLY</span></div><div className="hostGrid"><button className="cmd primary" onClick={newHand}>＋ NEW HAND</button><button className="cmd accent" onClick={drawNext}>DRAW NEXT CARD</button><button className="cmd" onClick={drawStreet}>NEXT STREET</button><button className="cmd" onClick={showdown}>SHOWDOWN</button><button className="cmd warn" onClick={undo}>UNDO</button><button className="cmd" onClick={()=>patch({showHost:!s.showHost},s.showHost?'Host cards hidden.':'Host cards revealed.')}>{s.showHost?'HIDE HOST':'REVEAL HOST'}</button></div><div className="divider"/><div className="hint">Host owns the deck and table state. Common shortcuts:</div><div className="kbdLegend"><span><b className="key">N</b> new</span><span><b className="key">D</b> draw</span><span><b className="key">S</b> street</span><span><b className="key">R</b> showdown</span><span><b className="key">U</b> undo</span><span><b className="key">L</b> lock</span></div></div><PlayerControls/><div className="panelCard logPanel"><div className="panelTitle"><strong>Hand history</strong><span>{s.history.length} EVENTS</span></div><div className="log">{s.history.length?s.history.map((h,i)=><div className="logItem" key={i}><time>{h.time}</time><b>{h.text}</b></div>):<div className="emptyLog">No actions yet.</div>}</div></div></aside>:<PlayerControls big/>}</main>}
  <div className={'drawerShade '+(menu?'open':'')} onClick={()=>setMenu(false)}/><aside className={'drawer '+(menu?'open':'')}><div className="drawerHead"><div><h2>Host Command Center</h2><p>Private table administration and presentation controls.</p></div><button className="drawerClose" onClick={()=>setMenu(false)}>✕</button></div>
   <div className="settingsSection"><h3>Players & blinds</h3><div className="fieldGrid"><div className="field"><label>Host name</label><input value={draft.dealerName??''} onChange={e=>setDraft({...draft,dealerName:e.target.value})}/></div><div className="field"><label>Player name</label><input value={draft.playerName??''} onChange={e=>setDraft({...draft,playerName:e.target.value})}/></div><div className="field"><label>Host stack</label><input type="number" value={draft.dealer??''} onChange={e=>setDraft({...draft,dealer:e.target.value})}/></div><div className="field"><label>Player stack</label><input type="number" value={draft.player??''} onChange={e=>setDraft({...draft,player:e.target.value})}/></div><div className="field"><label>Small blind</label><input type="number" value={draft.smallBlind??''} onChange={e=>setDraft({...draft,smallBlind:e.target.value})}/></div><div className="field"><label>Big blind</label><input type="number" value={draft.bigBlind??''} onChange={e=>setDraft({...draft,bigBlind:e.target.value})}/></div><div className="field"><label>Minimum bet</label><input type="number" value={draft.minBet??''} onChange={e=>setDraft({...draft,minBet:e.target.value})}/></div><div className="field"><label>Bet increment</label><input type="number" value={draft.betStep??''} onChange={e=>setDraft({...draft,betStep:e.target.value})}/></div></div><div style={{marginTop:10}}><button className="cmd primary" style={{width:'100%'}} onClick={applySettings}>APPLY TABLE SETTINGS</button></div></div>
   <div className="settingsSection"><h3>Player authority</h3><div className="toggleRow"><span>Lock Player 2 controls</span><input type="checkbox" checked={s.lockPlayer} onChange={e=>patch({lockPlayer:e.target.checked},e.target.checked?'Player controls locked.':'Player controls unlocked.')}/></div><div className="drawerActions"><button className="cmd" onClick={()=>force('check')}>FORCE CHECK</button><button className="cmd" onClick={()=>force('call')}>FORCE CALL</button><button className="cmd danger" style={{gridColumn:'1/-1'}} onClick={()=>force('fold')}>FORCE FOLD</button></div></div>
   <div className="settingsSection"><h3>Pot correction</h3><div className="miniRow field"><input type="number" value={potAdjust} onChange={e=>setPotAdjust(e.target.value)} placeholder="Amount"/><button className="cmd" onClick={()=>adjustPot(Math.abs(+potAdjust||0))}>+ ADD</button><button className="cmd" onClick={()=>adjustPot(-Math.abs(+potAdjust||0))}>− REMOVE</button></div></div>
   <div className="settingsSection"><h3>Visibility & presentation</h3><div className="toggleRow"><span>Reveal host hole cards</span><input type="checkbox" checked={s.showHost} onChange={e=>patch({showHost:e.target.checked})}/></div><div className="toggleRow"><span>Sound effects</span><input type="checkbox" checked={s.sound} onChange={e=>patch({sound:e.target.checked})}/></div><div className="toggleRow"><span>Presentation mode</span><input type="checkbox" checked={presentation} onChange={e=>setPresentation(e.target.checked)}/></div><div className="field"><label>Table theme</label><select value={s.theme} onChange={e=>patch({theme:e.target.value},`Theme changed to ${e.target.value}.`)}><option value="classic">Classic Emerald</option><option value="midnight">Midnight Blue</option><option value="crimson">Crimson Lounge</option></select></div></div>
   <div className="settingsSection"><h3>Manual table actions</h3><div className="drawerActions"><button className="cmd" onClick={()=>{patch({deck:[...s.deck].sort(()=>Math.random()-.5)},'Host shuffled the remaining deck.');setToast('Deck shuffled')}}>SHUFFLE DECK</button><button className="cmd" onClick={undo}>UNDO LAST</button><button className="cmd" onClick={()=>award('host')}>AWARD HOST</button><button className="cmd" onClick={()=>award('player')}>AWARD PLAYER</button><button className="cmd danger" style={{gridColumn:'1/-1'}} onClick={reset}>RESET TABLE</button></div></div>
  </aside><div className={'toast '+(toast?'show':'')}>{toast}</div>
 </div>
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
